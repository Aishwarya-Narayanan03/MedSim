# MedSim Cloud Build CI/CD
# Builds, pushes, and deploys all services to GCP Cloud Run
# Injects secrets from GCP Secrets Manager

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/frontend:latest', './frontend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/backend:latest', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/adk-agent:latest', './adk-agent']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/embedding-service:latest', './embedding-service']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/jobs:latest', './jobs']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/frontend:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/backend:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/adk-agent:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/embedding-service:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'REGION-docker.pkg.dev/PROJECT_ID/medsim/jobs:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy medsim-frontend --image=REGION-docker.pkg.dev/PROJECT_ID/medsim/frontend:latest --region=REGION --set-secrets=FRONTEND_ALLOWED_DOMAINS=projects/PROJECT_ID/secrets/FRONTEND_ALLOWED_DOMAINS:latest,OIDC_CLIENT_ID=projects/PROJECT_ID/secrets/OIDC_CLIENT_ID:latest,BACKEND_URL=projects/PROJECT_ID/secrets/BACKEND_URL:latest,EMBEDDINGS_SERVICE_URL=projects/PROJECT_ID/secrets/EMBEDDINGS_SERVICE_URL:latest
        gcloud run deploy medsim-backend --image=REGION-docker.pkg.dev/PROJECT_ID/medsim/backend:latest --region=REGION --set-secrets=BACKEND_JWT_SECRET=projects/PROJECT_ID/secrets/BACKEND_JWT_SECRET:latest,FIRESTORE_COLLECTION=projects/PROJECT_ID/secrets/FIRESTORE_COLLECTION:latest,GCS_BUCKET=projects/PROJECT_ID/secrets/GCS_BUCKET:latest,BQ_EVENTS_TABLE=projects/PROJECT_ID/secrets/BQ_EVENTS_TABLE:latest,VERTEX_EMBED_API=projects/PROJECT_ID/secrets/VERTEX_EMBED_API:latest,VERTEX_LLM_API=projects/PROJECT_ID/secrets/VERTEX_LLM_API:latest
        gcloud run deploy medsim-adk-agent --image=REGION-docker.pkg.dev/PROJECT_ID/medsim/adk-agent:latest --region=REGION --set-secrets=AGENT_SYSTEM_PROMPT=projects/PROJECT_ID/secrets/AGENT_SYSTEM_PROMPT:latest,BACKEND_URL=projects/PROJECT_ID/secrets/BACKEND_URL:latest
        gcloud run deploy medsim-embedding-service --image=REGION-docker.pkg.dev/PROJECT_ID/medsim/embedding-service:latest --region=REGION --set-secrets=VERTEX_EMBED_API=projects/PROJECT_ID/secrets/VERTEX_EMBED_API:latest,USE_VERTEX_MOCK=projects/PROJECT_ID/secrets/USE_VERTEX_MOCK:latest
        gcloud run deploy medsim-jobs --image=REGION-docker.pkg.dev/PROJECT_ID/medsim/jobs:latest --region=REGION --set-secrets=BACKEND_URL=projects/PROJECT_ID/secrets/BACKEND_URL:latest

images:
  - 'REGION-docker.pkg.dev/PROJECT_ID/medsim/frontend:latest'
  - 'REGION-docker.pkg.dev/PROJECT_ID/medsim/backend:latest'
  - 'REGION-docker.pkg.dev/PROJECT_ID/medsim/adk-agent:latest'
  - 'REGION-docker.pkg.dev/PROJECT_ID/medsim/embedding-service:latest'
  - 'REGION-docker.pkg.dev/PROJECT_ID/medsim/jobs:latest'
